services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autodetail-fdm-mvp:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Manufacturing Site}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      REQUESTS_WEBHOOK_URL: "${REQUESTS_WEBHOOK_URL:-}"
      REQUESTS_WEBHOOK_TOKEN: "${REQUESTS_WEBHOOK_TOKEN:-}"
      REQUESTS_WEBHOOK_TIMEOUT_MS: "${REQUESTS_WEBHOOK_TIMEOUT_MS:-10000}"
      REQUESTS_DATA_DIR: "${REQUESTS_DATA_DIR:-}"
      REQUEST_ATTACHMENTS_ACCESS_SECRET: "${REQUEST_ATTACHMENTS_ACCESS_SECRET:-}"
      INTERNAL_BACKOFFICE_PASSWORD: "${INTERNAL_BACKOFFICE_PASSWORD:-}"
      INTERNAL_BACKOFFICE_SESSION_SECRET: "${INTERNAL_BACKOFFICE_SESSION_SECRET:-}"
      ORDER_PUBLIC_ACCESS_SECRET: "${ORDER_PUBLIC_ACCESS_SECRET:-}"
      OPERATIONS_MESSENGER_WEBHOOK_URL: "${OPERATIONS_MESSENGER_WEBHOOK_URL:-}"
      OPERATIONS_MESSENGER_WEBHOOK_TOKEN: "${OPERATIONS_MESSENGER_WEBHOOK_TOKEN:-}"
      OPERATIONS_MESSENGER_LABEL: "${OPERATIONS_MESSENGER_LABEL:-}"
      OPERATIONS_EMAIL_WEBHOOK_URL: "${OPERATIONS_EMAIL_WEBHOOK_URL:-}"
      OPERATIONS_EMAIL_WEBHOOK_TOKEN: "${OPERATIONS_EMAIL_WEBHOOK_TOKEN:-}"
      OPERATIONS_EMAIL_LABEL: "${OPERATIONS_EMAIL_LABEL:-}"
      OPERATIONS_SHEETS_WEBHOOK_URL: "${OPERATIONS_SHEETS_WEBHOOK_URL:-}"
      OPERATIONS_SHEETS_WEBHOOK_TOKEN: "${OPERATIONS_SHEETS_WEBHOOK_TOKEN:-}"
      OPERATIONS_SHEETS_LABEL: "${OPERATIONS_SHEETS_LABEL:-}"
    volumes:
      - ./data/orders:/app/data/orders
      - ./data/requests:/app/data/requests
      - ./data/request-attachments:/app/data/request-attachments
